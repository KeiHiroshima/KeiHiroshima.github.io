- title: 研究内容
  type: nested_list
  contents:
    - title: 機械学習と最適化
      items:
        - 問題設定が曖昧でデータストリームが非定常といった実世界の環境における、機械学習システムの効率的な最適化。
        - 継続学習における嗜好対応モデルマージ（逐次タスクにわたる知識保持・破滅的忘却の回避）。
        - LLMを用いたブラックボックス最適化の自動定式化・アルゴリズム選択（自然言語記述のみからの探索空間の同定）。
        - 機械学習と最適化の融合、およびモデルが構造を推論する際の内部過程への関心。

