- title: Research Interests
  type: nested_list
  contents:
    - title: Machine Learning &amp; Optimization
      items:
        - Efficient adaptation and optimization of ML systems in real-world settings, where problems are underspecified and data arrives sequentially in non-stationary streams.
        - Preference-aware model merging for continual learning (retaining knowledge across sequential tasks without catastrophic forgetting).
        - LLM-driven formulation and algorithm selection for black-box optimization (from natural-language problem descriptions).
        - Closing the gap between machine learning and optimization, and understanding what happens inside models when they reason about structure.

